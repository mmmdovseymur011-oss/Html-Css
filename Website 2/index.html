<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qeydiyyat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>Qeydiyyat</h1>
      <form class="form">
        <label>
          Ad Soyad
          <input type="text" name="fullname" placeholder="Adınızı yazın" required>
        </label>
        <label>
          E-poçt
          <input type="email" name="email" placeholder="email@example.com" required>
        </label>
        <label>
          Şifrə
          <input type="password" name="password" placeholder="Şifrənizi daxil edin" required>
        </label>
        <label>
          Şifrə (təkrar)
          <input type="password" name="confirm_password" placeholder="Şifrəni təkrarlayın" required>
        </label>
        <button type="submit">Qeydiyyat et</button>
      </form>
      <p class="note">Hesabınız var? <a href="#">Daxil olun</a></p>
    </section>
  </main>
</body>
</html>
